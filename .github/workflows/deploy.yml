name: Deploy to VPS

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: timer-prosper-back
  REGISTRY: docker.io

jobs:
  build-and-deploy:
    if: contains(github.event.head_commit.message, 'Deploy')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.REGISTRY_USER }}/${{ env.IMAGE_NAME }}:latest

      - name: Render stack file with registry user
        run: |
          mkdir -p deploy/rendered
          sed "s/__REGISTRY_USER__/${{ secrets.REGISTRY_USER }}/g" deploy/stack.yml > deploy/rendered/stack.rendered.yml

      - name: Add SSH key and config
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Write private key exactly as-is from secret using printf to preserve multi-line content
          printf '%s' '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519_ci
          # Normalize Windows CRLF to LF
          tr -d '\r' < ~/.ssh/id_ed25519_ci > ~/.ssh/id_ed25519_ci.tmp && mv ~/.ssh/id_ed25519_ci.tmp ~/.ssh/id_ed25519_ci
          chmod 600 ~/.ssh/id_ed25519_ci
          # Write SSH config
          printf "Host vps\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519_ci\n  StrictHostKeyChecking no\n" "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          # Validate key parses
          ssh-keygen -y -f ~/.ssh/id_ed25519_ci > /dev/null

      - name: Test SSH connection
        run: ssh -vvv -i ~/.ssh/id_ed25519_ci -o StrictHostKeyChecking=no vps "echo ok"

      - name: Upload stack to VPS
        run: scp -i ~/.ssh/id_ed25519_ci -o StrictHostKeyChecking=no deploy/rendered/stack.rendered.yml vps:~/timer-prosper-stack.yml

      - name: Login to Docker Hub on VPS and deploy stack
        run: |
          ssh -i ~/.ssh/id_ed25519_ci -o StrictHostKeyChecking=no vps "docker login ${{ env.REGISTRY }} -u '${{ secrets.REGISTRY_USER }}' -p '${{ secrets.REGISTRY_PASS }}' && docker stack deploy -c ~/timer-prosper-stack.yml ${{ secrets.STACK_NAME }} --with-registry-auth"
